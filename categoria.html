      { category: 'Laços', size: 'Único', name: 'Laço Maria Flor Preto e Branco', price: 'R$ 15,99', color: 'photo-yellow', images: ['imagens/acessorios/lacos/gemini-generated-image-q2fof3q2fof3q2fo-377d3c807400e2f6d317860387588843-1024-1024.webp'] },
      { category: 'Laços', size: 'Único', name: 'Laço de Couro Marrom', price: 'R$ 11,99', color: 'photo-yellow', images: ['imagens/acessorios/lacos/gemini-generated-image-q62pohq62pohq62p-361d93f32ae76023f817872357636982-1024-1024.webp'] },
      { category: 'Laços', size: 'Único', name: 'Laço Mundo Mágico da Gabby', price: 'R$ 19,99', color: 'photo-yellow', images: ['imagens/acessorios/lacos/lacoluxogabby1-2906c10b048387115e16679120213319-1024-1024.webp'] },
      { category: 'Mamadeiras', size: 'Kit 3', name: 'Mamadeira Easy Flow Anticólica - Kit 3 Brancas', price: 'R$ 39,99', color: 'photo-blue', images: ['imagens/acessorios/mamadeira/20990-kit-3-mamadeiras-easy-flow-nuvem-branca-120-270-330ml-03-embalagem01.webp'] },
      { category: 'Mamadeiras', size: 'Único', name: 'Copo com Alça Removível - Azul', price: 'R$ 14,99', color: 'photo-blue', images: ['imagens/acessorios/mamadeira/22342-copo-com-alca-removivel-azul-03-embalagem.webp'] },
      { category: 'Mamadeiras', size: 'Único', name: 'Copo com Alça Removível - Rosa', price: 'R$ 14,99', color: 'photo-coral', images: ['imagens/acessorios/mamadeira/22343-copo-com-alca-removivel-rosa-01-detalhe03.webp'] },
      { category: 'Meia calça', size: '2 - 10', name: 'Meia-calça preta', price: 'R$ 29,99', color: 'photo-coral', images: ['imagens/acessorios/meia-calca/6638801-1200-auto.webp'] },
      { category: 'Meia calça', size: '2 - 10', name: 'Meia-calça branca', price: 'R$ 19,99', color: 'photo-coral', images: ['imagens/acessorios/meia-calca/6675498-1200-auto.png'] },
      { category: 'Suspensórios', size: 'Único', name: 'Kit Suspensório + Gravata Borboleta Infantil', price: 'R$ [A DEFINIR]', color: 'photo-blue', images: ['imagens/acessorios/suspensorios/d-nq-np-2x-669825-mla114662357219-072026-f.webp'] },
      { category: 'Suspensórios', size: 'Único', name: 'Kit Suspensório + Gravata Borboleta Infantil', price: 'R$ [A DEFINIR]', color: 'photo-blue', images: ['imagens/acessorios/suspensorios/d-nq-np-2x-897775-mla105452258143-012026-f-kit-gravata-e-suspensorio-infantil-varias-cores.webp'] }
    ];

    const lancamentos = [
      { category: 'Lançamentos', size: 'P, M, G', name: 'Bodys em destaque', price: 'R$ [A DEFINIR]', color: 'photo-coral' },
      { category: 'Lançamentos', size: '1 - 3', name: 'Macacão novo', price: 'R$ [A DEFINIR]', color: 'photo-blue' },
      { category: 'Lançamentos', size: '4 - 8', name: 'Coleção infantil', price: 'R$ [A DEFINIR]', color: 'photo-yellow' },
      { category: 'Lançamentos', size: '10 - 14', name: 'Conjuntos premium', price: 'R$ [A DEFINIR]', color: 'photo-coral' }
    ];

    const params = new URLSearchParams(window.location.search);
    const selectedCategory = params.get('categoria');
    const selectedSize = params.get('tamanho');
    const selectedPrice = params.get('preco');
    const selectedAudience = params.get('publico');
    const selectedSearch = (params.get('busca') || '').trim();

    let products = [];
    let title = 'Produtos';
    let description = 'Confira os produtos disponíveis.';

    function matchesPriceRange(product) {
      const priceMatch = String(product.price || '').match(/R\$\s*([\d.]+,\d{2})/i);
      if (!priceMatch) return false;

      const priceValue = Number(priceMatch[1].replace(/\./g, '').replace(',', '.'));
      if (!Number.isFinite(priceValue)) return false;

      if (selectedPrice === 'ate-30') return priceValue <= 30;
      if (selectedPrice === 'ate-50') return priceValue <= 50;
      if (selectedPrice === 'ate-80') return priceValue <= 80;
      if (selectedPrice === 'ate-100') return priceValue <= 100;
      if (selectedPrice === 'mais-100') return priceValue > 100;
      return false;
    }

    function matchesSelectedSize(product) {
      if (product.name === product.category) {
        return false;
      }

      const productSizes = String(product.size || '').toLowerCase().split(',').map(function (size) {
        return size.trim();
      });

      if (selectedSize === 'Recém nascido') {
        return productSizes.includes('rn');
      }

      if (selectedSize === 'P, M, G') {
        return ['p', 'm', 'g'].every(function (size) {
          return productSizes.includes(size);
        });
      }

      const selectedRange = String(selectedSize).match(/^(\d+)\s*-\s*(\d+)$/);
      if (selectedRange) {
        const selectedMinimum = Number(selectedRange[1]);
        const selectedMaximum = Number(selectedRange[2]);
        return productSizes.some(function (size) {
          const productRange = size.match(/^(\d+)\s*-\s*(\d+)$/);
          if (productRange) {
            return Number(productRange[1]) <= selectedMaximum && Number(productRange[2]) >= selectedMinimum;
          }
          const productSize = Number(size);
          return Number.isInteger(productSize) && productSize >= selectedMinimum && productSize <= selectedMaximum;
        });
      }

      return productSizes.includes(String(selectedSize).toLowerCase());
    }

    function normalizeSearchText(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    if (selectedSearch) {
      const searchTerm = normalizeSearchText(selectedSearch);
      products = catalog.filter(function (product) {
        return product.name !== product.category &&
          (normalizeSearchText(product.name).includes(searchTerm) || normalizeSearchText(product.category).includes(searchTerm));
      });
      title = 'Resultados da busca';
      description = 'Produtos encontrados para “' + selectedSearch + '”.';
    } else if (selectedCategory) {
      if (selectedCategory === 'Lançamentos') {
        products = lancamentos;
      } else {
        products = catalog.filter(function (product) {
          return product.category === selectedCategory && (!selectedAudience || (
            product.audience === selectedAudience &&
            (product.name !== product.category || !catalog.some(function (audienceProduct) {
              return audienceProduct.category === selectedCategory && audienceProduct.audience === selectedAudience && audienceProduct.name !== selectedCategory;
            })
          ) || (!product.audience && !catalog.some(function (audienceProduct) {
            return audienceProduct.category === selectedCategory && audienceProduct.audience === selectedAudience;
          }))));
        });
      }
      title = selectedCategory;
      description = 'Produtos disponíveis em ' + selectedCategory + '.';
    } else if (selectedSize) {
      products = catalog.filter(function (product) {
        return matchesSelectedSize(product);
      });
      title = selectedSize;
      description = 'Produtos disponíveis no tamanho ' + selectedSize + '.';
    } else if (selectedPrice) {
      products = catalog.filter(matchesPriceRange);
      title = selectedPrice === 'mais-100' ? 'Mais de R$ 100,00' : 'Até R$ ' + selectedPrice.replace('ate-', '') + ',00';
      description = 'Produtos disponíveis na faixa de preço ' + title + '.';
    } else {
      products = catalog;
      title = 'Produtos';
      description = 'Confira os produtos disponíveis.';
    }

    document.getElementById('titulo-categoria').textContent = title;
    document.getElementById('descricao-categoria').textContent = description;

    const container = document.getElementById('category-products');
    container.innerHTML = products.map(function (product) {
      const hasAudienceImages = ['Blusas de frio', 'Body de calor', 'Body de frio', 'Calças', 'Camisetas', 'Macacões de calor', 'Macacões de frio', 'Mijão', 'Short tapa fralda', 'Conjuntos de calor', 'Conjuntos de frio', 'Shorts', 'Chupetas', 'Laços', 'Mamadeiras', 'Meia calça', 'Meias', 'Suspensórios', 'Tiaras'].includes(product.category);
      const selectedImage = product.audience
        ? product.images || product.image || ''
        : selectedAudience && hasAudienceImages
        ? selectedAudience === 'bebe-menina' ? product.image || '' : selectedAudience === 'bebe-menino' ? product.boyImage || '' : selectedAudience === 'meninas' ? product.girlsImage || '' : selectedAudience === 'meninos' ? product.meninosImage || '' : selectedAudience === 'acessorios' ? product.images || '' : ''
        : product.images || (product.image ? product.image : '');
      const productImages = Array.isArray(selectedImage) ? selectedImage : [selectedImage];
      return productImages.map(function (image) {
        const productAudience = selectedAudience || product.audience;
        const productLink = 'produto.html?categoria=' + encodeURIComponent(product.category) + '&nome=' + encodeURIComponent(product.name) + (productAudience ? '&publico=' + encodeURIComponent(productAudience) : '') + '&imagem=' + encodeURIComponent(image || 'none');
        return `
        <article class="product-card">
          <a href="${productLink}" class="product-photo-link" aria-label="Abrir detalhes de ${product.name}">
            <div class="product-photo ${product.color}" aria-label="${product.name}">${image ? '<img src="' + image + '" alt="' + product.name + '">' : ''}</div>
          </a>
          <div class="product-info">
            <p class="product-category">${product.category}</p>
            <h2>${product.name}</h2>
            <p class="price">${product.price}</p>
            <a href="${productLink}">Ver produto <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      `;
      }).join('');
    }).join('');

    function showNoSearchResults() {
      if (!selectedSearch || container.querySelector('.product-card')) return;
      const message = document.createElement('p');
      message.className = 'search-empty';
      message.textContent = 'Não encontramos produtos para “' + selectedSearch + '”. Tente outro nome ou categoria.';
      container.appendChild(message);
    }

    showNoSearchResults();

    if (selectedSize || selectedPrice || selectedSearch) {
      container.querySelectorAll('.product-card').forEach(function (card) {
        const image = card.querySelector('.product-photo img');
        if (!image || image.complete && image.naturalWidth === 0) {
          card.remove();
          showNoSearchResults();
          return;
        }
        image.addEventListener('error', function () {
          card.remove();
          showNoSearchResults();
        }, { once: true });
      });
    }
  </script>
</body>
</html>
